<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AYES Gelir Gider</title><style>body{font:16px system-ui;background:#eef1f5;margin:0;color:#152237}header{background:#162b43;color:white;padding:20px}main{max-width:760px;margin:auto;padding:15px}section{background:white;border-radius:12px;padding:16px;margin:12px 0}input,select,button{padding:12px;margin:5px 0;width:100%;box-sizing:border-box;font:inherit}button{background:#b41f2b;color:white;border:0;border-radius:8px}nav{display:flex;gap:8px}nav button{flex:1}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}small{color:#667}strong{font-size:20px}</style></head><body><header><h2>AYES Gelir Gider Takip</h2><small style="color:#ddd">Ev ve iş yeri ayrı hesaplar</small></header><main><nav><button onclick="setAccount('is')">AYES İş Yeri</button><button onclick="setAccount('ev')">Umut Kayısı Ev</button></nav><section><h2 id="account"></h2><p>Gelir: <strong id="income"></strong></p><p>Gider: <strong id="expense"></strong></p><p>Bakiye: <strong id="balance"></strong></p></section><section><h3>Yeni kayıt</h3><form id="form"><select id="type"><option value="gelir">Gelir</option><option value="gider">Gider</option></select><input id="date" type="date" required><input id="category" placeholder="Kategori (örn. Kira, Servis)" required maxlength="80"><input id="amount" type="number" step="0.01" min="0.01" placeholder="Tutar TL" required><input id="note" placeholder="Açıklama" maxlength="200"><button>Kaydet</button></form></section><section><h3>Kayıtlar</h3><table><thead><tr><th>Tarih</th><th>İşlem</th><th>Tutar</th><th></th></tr></thead><tbody id="entries"></tbody></table></section><section><h3>Yedekleme</h3><button onclick="backup()">JSON yedeğini indir</button><input type="file" id="restore" accept=".json,application/json"><button onclick="restoreData()">Yedekten geri yükle</button><p><small>Veriler bu cihazda saklanır. Telefon ve bilgisayar otomatik eşitlenmez. Düzenli yedek alın.</small></p></section></main><script>
const key='ayes-gelir-gider-v1';let account='is';let records=[];try{let v=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(v))records=v}catch(e){}
const el=id=>document.getElementById(id);const money=n=>Number(n).toLocaleString('tr-TR',{style:'currency',currency:'TRY'});el('date').value=new Date().toISOString().slice(0,10);
function save(){localStorage.setItem(key,JSON.stringify(records));render()}
function setAccount(a){account=a;render()}
function render(){el('account').textContent=account==='is'?'AYES Güvenlik Sistemleri':'Umut Kayısı – Ev';let a=records.filter(x=>x.account===account),inc=a.filter(x=>x.type==='gelir').reduce((s,x)=>s+x.amount,0),exp=a.filter(x=>x.type==='gider').reduce((s,x)=>s+x.amount,0);el('income').textContent=money(inc);el('expense').textContent=money(exp);el('balance').textContent=money(inc-exp);el('entries').replaceChildren();a.slice().sort((x,y)=>y.date.localeCompare(x.date)).forEach(x=>{let tr=document.createElement('tr');[x.date,x.type+' / '+x.category,money(x.amount)].forEach(v=>{let td=document.createElement('td');td.textContent=v;tr.append(td)});let td=document.createElement('td'),b=document.createElement('button');b.textContent='Sil';b.onclick=()=>{if(confirm('Kaydı sil?')){records=records.filter(y=>y.id!==x.id);save()}};td.append(b);tr.append(td);el('entries').append(tr)})}
el('form').onsubmit=e=>{e.preventDefault();let amount=Number(el('amount').value);if(!Number.isFinite(amount)||amount<=0)return;records.push({id:Date.now()+'-'+Math.random(),account,type:el('type').value,date:el('date').value,category:el('category').value.trim(),amount,note:el('note').value.trim()});save();el('amount').value='';el('note').value=''};
function backup(){let blob=new Blob([JSON.stringify(records,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ayes-gelir-gider-yedek.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function restoreData(){let f=el('restore').files[0];if(!f)return alert('Yedek dosyası seçin');try{let v=JSON.parse(await f.text());if(!Array.isArray(v)||!v.every(x=>['is','ev'].includes(x.account)&&['gelir','gider'].includes(x.type)&&Number.isFinite(x.amount)))throw Error('Geçersiz yedek');if(confirm('Mevcut kayıtlar yedekle değiştirilsin mi?')){records=v;save()}}catch(e){alert('Yedek okunamadı: '+e.message)}}render();
</script></body></html>
